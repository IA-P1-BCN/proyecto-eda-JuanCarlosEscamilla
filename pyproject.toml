[project]
name = "eda-oposicions"
version = "0.1.0"
description = "Monorepo del EDA de procesos selectivos IT en ayuntamientos de la provincia de Barcelona (CIDO DIBA)"
requires-python = ">=3.12"
dependencies = [
    "eda-ingesta",
    "eda-core",
    "eda-pipeline",
    "eda-app",
    "jupyter>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
eda-ingesta = { workspace = true }
eda-core = { workspace = true }
eda-pipeline = { workspace = true }
eda-app = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
