version: '3'

# Punto de entrada único del proyecto — task --list para verlo todo.
# Documentación viva: cada comando nuevo del proyecto entra aquí como task.

tasks:
  sync:
    desc: Instala el monorepo completo (uv sync, un venv, un lockfile)
    cmds:
      - uv sync

  test:
    desc: Tests de todos los paquetes (packages/*/tests)
    cmds:
      - uv run pytest -q

  pipeline:
    desc: Proceso completo — descarga → limpia → enriquece → exporta
    cmds:
      - uv run eda-pipeline --step all

  download:
    desc: Bootstrap ingesta (materia IT + Vic 45km) — progreso en vivo, reanuda por caché
    cmds:
      - uv run eda-pipeline --step download --pausa {{.PAUSA | default 0.5}}{{if .MAX_PAGINAS}} --max-paginas {{.MAX_PAGINAS}}{{end}}

  scan-rss:
    desc: Refresco incremental vía RSS (1 petición + solo fichas nuevas)
    cmds:
      - uv run eda-pipeline --step scan --pausa {{.PAUSA | default 0.5}}

  dashboard:
    desc: Dashboard Streamlit local (US9)
    cmds:
      - uv run streamlit run packages/eda_app/src/eda_app/app.py

  dataset-release:
    desc: Publica dataset-v<hash> como release si el CSV cambió (mismo script que Actions)
    cmds:
      - bash .github/scripts/dataset-release.sh

  airflow-up:
    desc: Stack de Airflow (docker compose) — US11
    cmds:
      - docker compose -f infra/docker-compose.yml up -d
      - cmd: echo "UI → http://localhost:8080 (admin/admin)"
        silent: true

  airflow-down:
    desc: Para el stack de Airflow
    cmds:
      - docker compose -f infra/docker-compose.yml down

  default:
    desc: Lista las tareas disponibles
    cmds:
      - task --list
    silent: true
