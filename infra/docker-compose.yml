# Airflow local del proyecto — stack completo con un comando: task airflow-up
# Requisitos previos (macOS/colima): PREREQUISITES.md — colima start --cpu 4 --memory 8
# El DAG (airflow/dags/eda_oposicions.py) se añade en US11; los volúmenes ya montan
# packages/ y data/ para que los módulos del monorepo sean importables.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "eda-oposicions-dev-secret"
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    # el monorepo es importable dentro del contenedor:
    PYTHONPATH: /opt/airflow/packages/eda_ingesta/src:/opt/airflow/packages/eda_core/src:/opt/airflow/packages/eda_pipeline/src
    _PIP_ADDITIONAL_REQUIREMENTS: "beautifulsoup4"
  working_dir: /opt/airflow
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../packages:/opt/airflow/packages
    - ../data:/opt/airflow/data
    - ../reports:/opt/airflow/reports
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init: # solo primera vez: migra la BD y crea el usuario admin/admin
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create -u admin -p admin -r Admin -e admin@eda.local -f EDA -l Oposicions || true
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      retries: 5
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 5
    restart: always

volumes:
  postgres-db:
