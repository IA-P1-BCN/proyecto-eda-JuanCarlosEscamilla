[project]
name = "eda-core"
version = "0.1.0"
description = "Lógica de negocio: limpieza, enriquecimiento y features del dataset CIDO"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_core"]
