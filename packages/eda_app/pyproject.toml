[project]
name = "eda-app"
version = "0.1.0"
description = "Dashboard Streamlit del proyecto (despliegue en Render, US9-US10)"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "eda-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_app"]

[tool.uv.sources]
eda-core = { workspace = true }
