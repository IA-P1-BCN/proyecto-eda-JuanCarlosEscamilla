[project]
name = "eda-ingesta"
version = "0.1.0"
description = "Ingesta del CIDO DIBA: scraper educado/cacheado + población municipal + profiling"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_ingesta"]
